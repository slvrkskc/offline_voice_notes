# --- JVM -------------------------------------------------------------------
# A 26-module build with an NDK component needs headroom. Lower this if the
# machine has less than 16 GB of RAM.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# --- Build speed -----------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX --------------------------------------------------------------
android.useAndroidX=true

# --- Native ----------------------------------------------------------------
# Only 64-bit ARM for devices plus x86_64 for the emulator. Dropping
# armeabi-v7a keeps the APK and the native build small; 32-bit devices are
# below our hardware floor anyway (ARCHITECTURE.md §2).
# Uncomment once :ml:native exists:
# android.defaultConfig.ndk.abiFilters=arm64-v8a,x86_64

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
